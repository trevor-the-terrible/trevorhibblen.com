<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Trevor Hibblen</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/title.woff2" />
    <style>
      @font-face {
        font-family: "Title";
        font-display: swap;
        src: url("fonts/title.woff2") format("woff2");
      }

      *,
      ::before,
      ::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #container {
        width: 100vw;
        height: 100vh;
        min-width: 100vw;
        min-height: 100vh;
      }

      html {
        font-size: 16px;
        line-height: 1.5;
      }

      body {
        overflow-x: hidden;
        background: oklch(93.88% 0.033 300.19);
      }

      #container {
        text-wrap: pretty;
      }

      .background {
        position: fixed;
        z-index: -1;
        max-width: 100%;
        transform: translateZ(0);
        transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* 128px center of the original 480px animation at half resolution, so blur and scale are doubled. */
      .background.light {
        display: block;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: none;
        filter: blur(4px);
        scale: 50;
      }

      /*
       * 64x48 crop at (72, 88) of the original 220px animation. The box and transform-origin
       * place the crop where it sat when the full image was stretched over the viewport.
       */
      .background.dark {
        display: none;
        left: calc(100vw * 72 / 220);
        top: calc(100vh * 88 / 220);
        width: calc(100vw * 64 / 220);
        height: calc(100vh * 48 / 220);
        transform-origin: calc(100vw * 38 / 220) calc(100vh * 22 / 220);
        filter: blur(8px);
        scale: 55;
        translate: 600px -150px;
      }

      main {
        display: flex;
        justify-content: center;
        height: 100%;
        opacity: 0;
        transition: opacity 1000ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      main.ready {
        opacity: 1;
      }

      section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        gap: 0.5rem;
        width: 100%;
        height: 100%;
      }

      .frosted-panel {
        padding: 2rem 8rem;
        border-radius: 0.375rem;
        background: rgb(255 255 255 / 0.2);
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
      }

      h1 {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 7rem;
        width: 100%;
        height: 100%;
        font-family: "Title", Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-size: inherit;
        font-weight: normal;
        color: #502da1;
        text-shadow: 1px 1px #000;
      }

      .greeting {
        font-size: 4rem;
        text-align: center;
      }

      .tagline {
        display: block;
        font-size: 0.875rem;
        line-height: calc(1.25 / 0.875);
        text-align: center;
        text-shadow: none;
      }

      .wavy-group {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: inherit;
        text-decoration: none;
      }

      .wavy-group svg {
        display: inline-block;
        width: 5rem;
        height: 5rem;
        transition: all 700ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .tooltip {
        position: absolute;
        top: -3rem;
        left: 50%;
        translate: -50% 0;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        background: #502da1;
        color: #fff;
        font-size: 0.875rem;
        line-height: calc(1.25 / 0.875);
        font-style: italic;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1) 1000ms;
      }

      @media (hover: hover) {
        .wavy-group:hover .tooltip {
          opacity: 1;
        }
      }

      @keyframes wavyhand {
        from {
          transform: rotate(-8deg);
        }
        to {
          transform: rotate(8deg);
        }
      }

      .wavy-group:hover .wavy-hand {
        animation: wavyhand 1s linear alternate-reverse infinite;
        color: coral;
        filter: drop-shadow(0 4px 0px #502da1cc);
      }

      @keyframes wavy {
        from {
          stroke-dashoffset: -25;
        }
        to {
          stroke-dashoffset: 25;
        }
      }

      .wavy-group:hover .wavy {
        stroke-dasharray: 25, 25;
        color: cyan;
        animation: wavy 3100ms linear reverse infinite;
        filter: drop-shadow(0 4px 0px #502da1cc);
      }

      @media (min-width: 40rem) {
        section {
          padding-inline: 1.5rem;
        }

        .greeting {
          font-size: 8rem;
          line-height: 1;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: oklch(30.14% 0.0826 296.5);
        }

        .background.light {
          display: none;
        }

        .background.dark {
          display: block;
        }

        .frosted-panel {
          background: rgb(0 0 0 / 0.2);
        }

        h1 {
          color: oklch(98.5% 0.001 106.423);
        }

        .tooltip {
          background: rgb(0 0 0 / 0.5);
        }
      }
    </style>
    <noscript>
      <style>
        main {
          opacity: 1;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="container">
      <img class="background light" src="light.avif" alt="" />
      <img class="background dark" src="dark.webp" alt="" />

      <main>
        <section>
          <div class="frosted-panel">
            <h1 data-test="title">
              <span class="greeting">
                Hi.
                <span class="tagline">This is where I park my name.</span>
              </span>

              <a class="wavy-group" href="https://www.linkedin.com/in/trevor-hibblen-53b9b3a" target="linkedin.com" rel="noopener" aria-label="LinkedIn">
                <svg class="wavy-hand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" /><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" /><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" /><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></svg>
                <svg class="wavy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12q2.5 2 5 0t5 0 5 0 5 0" /><path d="M2 19q2.5 2 5 0t5 0 5 0 5 0" /><path d="M2 5q2.5 2 5 0t5 0 5 0 5 0" /></svg>
                <span class="tooltip">Hand + Wave...or smelly hands?</span>
              </a>
            </h1>
          </div>
        </section>
      </main>
    </div>

    <script>
      // Keep the page hidden until the title font is ready to avoid a visible font swap.
      document.fonts.load("1rem Title").finally(() => {
        document.querySelector("main").classList.add("ready");
      });
    </script>
  </body>
</html>
