name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
      SITE_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.SITE_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Upload to S3
        run: |
          aws s3 sync site "s3://$SITE_BUCKET" --exclude "*.DS_Store"
          date | aws s3 cp - "s3://$SITE_BUCKET/v" --content-type text/plain

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$SITE_CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
